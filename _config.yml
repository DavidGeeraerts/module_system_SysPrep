title: module_system_SysPrep
description: System preparation module for Windows.
author: David Geeraerts
remote_theme: just-the-docs/just-the-docs

search_enabled: true

plugins:
  - jekyll-remote-theme
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jemoji

readme_index:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

exclude:
  - AGENTS.md
  - LICENSE
  - .github
  - .gitignore
  - .gitattributes
  - .agents
