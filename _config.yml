title: module_system_SysPrep
description: System preparation module for Windows.
author: David Geeraerts
url: "https://davidgeeraerts.github.io"
baseurl: "/module_system_SysPrep"
theme: jekyll-theme-hacker

search_enabled: true

plugins:
  - jekyll-remote-theme
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jemoji

readme_index:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

exclude:
  - AGENTS.md
  - .github
  - .gitignore
  - .gitattributes
  - .agents
